<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Marafonu | 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --gold: #d4af37; --dark-blue: #0c1445; --white: #f8f9fa; }
        body { background: linear-gradient(135deg, var(--dark-blue), #1d2b64); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-blue); z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        input, textarea { padding: 12px; border-radius: 10px; border: 1px solid var(--gold); background: rgba(255,255,255,0.1); color: white; margin-bottom: 10px; width: 250px; text-align: center; font-family: inherit; }
        
        .timer-box { font-size: 1.5rem; color: var(--gold); font-weight: bold; margin: 10px 0; border: 1px solid rgba(212, 175, 55, 0.3); padding: 10px 20px; border-radius: 50px; background: rgba(0,0,0,0.2); }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(65px, 1fr)); gap: 10px; width: 95%; max-width: 500px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; }
        
        .day-box { aspect-ratio: 1/1; background: var(--dark-blue); border: 1px solid var(--gold); border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .day-box.locked { opacity: 0.3; cursor: not-allowed; background: #111; }
        .day-box.completed { background: var(--gold); color: var(--dark-blue); box-shadow: 0 0 15px var(--gold); }
        
        .stat-card { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; border: 1px solid var(--gold); text-align: center; backdrop-filter: blur(5px); margin: 10px; width: 85%; max-width: 450px; }
        
        .tasbeh-btn { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--gold); background: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; margin: 10px; outline: none; -webkit-tap-highlight-color: transparent; }
        .tasbeh-btn:active { transform: scale(0.9); background: rgba(212, 175, 55, 0.2); }

        #task-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #333; padding: 25px; border-radius: 20px; z-index: 1000; width: 85%; max-width: 350px; text-align: center; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; }
        .btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 25px; width: 100%; cursor: pointer; font-weight: bold; }
        
        .dua-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 5px; text-align: left; border-left: 3px solid var(--gold); font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2>🌙 Ramazan Marafonu</h2>
    <input type="text" id="username" placeholder="Adını daxil et">
    <button class="btn" style="width: 275px;" onclick="login()">Daxil Ol</button>
</div>

<header style="text-align: center; padding: 15px;">
    <h1>Ramazan 2026</h1>
    <div class="timer-box" id="iftar-timer">İftar yüklənir...</div>
    <div style="color: var(--gold);">Xalın: <span id="user-points">0</span></div>
</header>

<div class="stat-card">
    <span id="zikr-title">Sübhənallah</span>
    <div id="tasbeh-count" style="font-size: 2rem; font-weight: bold; color: var(--gold);">0</div>
    <button class="tasbeh-btn" onclick="hitTasbeh()">+</button>
    <div style="font-size: 0.7rem; opacity: 0.6;">Təsbeh üçün vurun</div>
</div>

<div class="grid-container" id="map"></div>

<div class="stat-card">
    <h3>🙏 Dua Divarı</h3>
    <textarea id="dua-input" placeholder="Duanı bura yaz..." style="width: 90%; height: 60px;"></textarea>
    <button class="btn" onclick="sendDua()" style="margin-top: 5px;">Dua Paylaş</button>
    <div id="dua-list" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
</div>

<div class="stat-card">
    <h3>🏆 Top 10 Lider</h3>
    <div id="leaderboard"></div>
</div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="task-modal">
    <h3 id="modal-day-title" style="color: var(--dark-blue);"></h3>
    <p id="modal-task-text" style="margin: 20px 0;"></p>
    <div id="task-action-area"></div>
    <button onclick="closeModal()" style="border:none; background:none; color:#999; margin-top:15px; cursor:pointer; font-weight: bold;">Daha sonra edəcəm</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBOFjAAqdoNyQqRY09pjIB83W0sfhrGBJA",
        authDomain: "amazanmarafonu.firebaseapp.com",
        databaseURL: "https://amazanmarafonu-default-rtdb.firebaseio.com",
        projectId: "amazanmarafonu",
        storageBucket: "amazanmarafonu.firebasestorage.app",
        messagingSenderId: "619549950176",
        appId: "1:619549950176:web:3075c336e0167aaa2f9085"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = localStorage.getItem('ramazanUser');
    let points = 0;
    let completedDays = [];
    const ramadanStart = new Date("2026-02-18T00:00:00");

    // 1. İftar Geri Sayım (Bakı vaxtı ilə təxmini 18:30 götürülür)
    function updateTimer() {
        const now = new Date();
        const iftar = new Date();
        iftar.setHours(18, 30, 0); // Bu saatı QMİ cədvəlinə görə hər gün yeniləyə bilərsən

        let diff = iftar - now;
        if (diff < 0) {
            document.getElementById('iftar-timer').innerText = "Allah qəbul etsin!";
            return;
        }

        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('iftar-timer').innerText = `İftara: ${h}s ${m}d ${s}san`;
    }
    setInterval(updateTimer, 1000);

    // 2. Təsbeh Funksiyası
    let localZikr = parseInt(localStorage.getItem('zikrCount')) || 0;
    document.getElementById('tasbeh-count').innerText = localZikr;
    
    function hitTasbeh() {
        localZikr++;
        document.getElementById('tasbeh-count').innerText = localZikr;
        localStorage.setItem('zikrCount', localZikr);
        if (navigator.vibrate) navigator.vibrate(40);
        
        // Hər 33-də zikri dəyişək
        const zikrs = ["Sübhənallah", "Əlhəmdülillah", "Allahuekbər"];
        document.getElementById('zikr-title').innerText = zikrs[Math.floor((localZikr % 99) / 33)] || "Sübhənallah";
    }

    // 3. Dua Divarı
    function sendDua() {
        const msg = document.getElementById('dua-input').value.trim();
        if(!msg) return;
        db.ref('prayers').push({ user: currentUser, text: msg, time: Date.now() });
        document.getElementById('dua-input').value = '';
    }

    db.ref('prayers').limitToLast(10).on('value', snap => {
        let html = '';
        snap.forEach(child => {
            const d = child.val();
            html = `<div class="dua-item"><b>${d.user}:</b> ${d.text}</div>` + html;
        });
        document.getElementById('dua-list').innerHTML = html;
    });

    // 4. Əsas Sistem
    if (currentUser) {
        document.getElementById('login-overlay').style.display = 'none';
        loadUserData();
    }

    function login() {
        const name = document.getElementById('username').value.trim();
        if (name.length < 2) return alert("Ad daxil edin!");
        currentUser = name;
        localStorage.setItem('ramazanUser', name);
        document.getElementById('login-overlay').style.display = 'none';
        loadUserData();
    }

    function loadUserData() {
        db.ref('users/' + currentUser).on('value', (snapshot) => {
            const data = snapshot.val() || { points: 0, completed: [] };
            points = data.points;
            completedDays = data.completed || [];
            document.getElementById('user-points').innerText = points;
            renderMap();
        });
        loadLeaderboard();
    }

    function renderMap() {
        const mapContainer = document.getElementById('map');
        mapContainer.innerHTML = '';
        const currentDay = Math.floor((new Date() - ramadanStart) / 86400000) + 1;

        for (let i = 1; i <= 30; i++) {
            const dayBox = document.createElement('div');
            dayBox.className = `day-box ${i > currentDay ? 'locked' : ''} ${completedDays.includes(i) ? 'completed' : ''}`;
            dayBox.innerText = i;
            dayBox.onclick = i <= currentDay ? () => openTask(i) : () => alert("Vaxtı gözləyin...");
            mapContainer.appendChild(dayBox);
        }
    }

    function openTask(day) {
        document.getElementById('modal-day-title').innerText = "Gün " + day;
        document.getElementById('modal-task-text').innerText = "Bu gün bir xeyir əməl et və xal qazan!";
        document.getElementById('task-action-area').innerHTML = completedDays.includes(day) ? 
            "✅ Tamamlanıb" : `<button class="btn" onclick="completeTask(${day})">Görevi bitirdim (+10)</button>`;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('task-modal').style.display = 'block';
    }

    function completeTask(day) {
        if (!completedDays.includes(day)) {
            completedDays.push(day);
            points += 10;
            db.ref('users/' + currentUser).update({ points: points, completed: completedDays });
        }
        closeModal();
    }

    function loadLeaderboard() {
        db.ref('users').orderByChild('points').limitToLast(10).on('value', snap => {
            let list = [];
            snap.forEach(c => list.push({n: c.key, p: c.val().points}));
            document.getElementById('leaderboard').innerHTML = list.reverse().map((u, i) => 
                `<div style="display:flex; justify-content:space-between; font-size:0.9rem; padding:3px;">
                    <span>${i+1}. ${u.n}</span> <span>${u.p} xal</span>
                </div>`).join('');
        });
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('task-modal').style.display = 'none';
    }
</script>

</body>
</html>
