<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Marafonu | 30 Günlük Macəra</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --gold: #d4af37;
            --dark-blue: #0c1445;
            --light-blue: #1d2b64;
            --white: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, var(--dark-blue), var(--light-blue));
            color: var(--white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Sağa sürüşmənin qarşısını alır */
        }

        /* Xoş gəldin bildirişi */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 1.8rem; color: var(--gold); margin-top: 10px; }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            width: 90%;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            flex: 1;
            max-width: 150px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .stat-card span {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
        }

        /* Mobilə uyğun Grid sistemi */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            width: 95%;
            max-width: 500px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .day-box {
            aspect-ratio: 1 / 1; /* Kvadrat qalması üçün */
            background: var(--dark-blue);
            border: 1px solid var(--gold);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .day-box.completed {
            background: var(--gold);
            color: var(--dark-blue);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Tapşırıq Modal */
        #task-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--white);
            color: #333;
            padding: 25px;
            border-radius: 20px;
            z-index: 1000;
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        .btn-complete {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }
    </style>
</head>
<body>

<div id="welcome-overlay" onclick="closeWelcome()">
    <div class="animate__animated animate__zoomIn">
        <h2 style="color: var(--gold);">🌙 Salam Aleykum</h2>
        <p style="font-size: 1.2rem;">Xoş gəldin, müsəlman yoldaşım!</p>
        <p style="font-size: 0.9rem; opacity: 0.7;">(Daxil olmaq üçün ekrana toxun)</p>
    </div>
</div>

<header class="animate__animated animate__fadeInDown">
    <h1>🌙 Ramazan Marafonu</h1>
    <p style="font-size: 0.8rem; opacity: 0.8;">30 Gün, 30 Xeyir Əməl</p>
</header>

<div class="stats-container">
    <div class="stat-card">Xalın <span id="user-points">0</span></div>
    <div class="stat-card">Tamamlanan <span id="completed-count">0</span></div>
</div>

<div class="grid-container" id="map"></div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="task-modal">
    <h3 id="modal-day-title" style="color: var(--dark-blue);">Gün 1</h3>
    <hr border="0" height="1px" background="#eee">
    <p id="modal-task-text" style="line-height: 1.5; font-weight: 500;"></p>
    <button class="btn-complete" onclick="completeTask()">Əməli etdim (+10 Bal)</button>
    <button onclick="closeModal()" style="border:none; background:none; color:#999; margin-top:15px; cursor:pointer;">Bağla</button>
</div>

<script>
    const tasks = [
        "Bu gün bir nəfərə salam ver və gülümsə. Təbəssüm sədəqədir.",
        "İftarda suyu oturaraq və 3 qurtuma içməyə çalış.",
        "Bu gün bir heyvana su və ya yem ver.",
        "Ailə üzvlərindən birinə 'səni çox istəyirəm' de və ya qucaqla.",
        "Bu gün bir ehtiyacı olana gizlicə sədəqə ver.",
        "Yemək yeyərkən duzdan az istifadə et, sağlığına diqqət et.",
        "Bu gün bir qonşuna iftardan pay göndər.",
        "Dilini pis sözlərdən və qeybətdən qoru.",
        "Bu gün ən azı 15 dəqiqə mənəvi kitab oxu.",
        "Köhnə bir dostuna zəng et və hal-əhval tut.",
        "Bu gün israfdan qaç: yeməyini və suyunu qənaətlə işlət.",
        "Bir uşağı sevindir (kiçik bir konfet belə kifayətdir).",
        "Bu gün valideynlərinin (və ya böyüklərin) xeyir-duasını al.",
        "Yol kənarındakı bir zibili götürüb qutuya at.",
        "Bu gün hər kəsə qarşı daha səbirli olacağına söz ver.",
        "İftar süfrəsinin qurulmasında ən böyük köməyi sən et.",
        "Bu gün bildiyin bir duanı başqasına da öyrət.",
        "Yatmazdan əvvəl gün ərzində etdiyin səhvlər üçün tövbə et.",
        "Bu gün sosial mediada keçirdiyin vaxtı yarıya endir.",
        "Susuz qalan bir ağacı və ya gülü sula.",
        "Bu gün özün üçün yox, bütün dünya məzlumları üçün dua et.",
        "Qəzəblənəndə dərhal dəstəmaz al və sakitləş.",
        "Bu gün bir nəfərin uğuruna ürəkdən sevin və onu təbrik et.",
        "Yeməkdən sonra süfrə duası etməyi unutma.",
        "Bu gün heç kimi tənqid etmə, ancaq müsbət tərəfləri gör.",
        "Gecə namazına (təhəccüd) qalxmağa çalış.",
        "Bu gün bir elm öyrən və onu kiməsə danış.",
        "Evinə gələn qonağa (və ya kuryerə) xoş söz de.",
        "Bu gün verdiyin sözlərin hamısını yerinə yetir.",
        "Ramazan bitir, bu ay qazandığın gözəl vərdişi davam etdirəcəyinə söz ver."
    ];

    let points = parseInt(localStorage.getItem('marafonPoints')) || 0;
    let completedDays = JSON.parse(localStorage.getItem('completedDays')) || [];
    let selectedDay = null;

    function updateStats() {
        document.getElementById('user-points').innerText = points;
        document.getElementById('completed-count').innerText = completedDays.length;
    }

    const mapContainer = document.getElementById('map');
    for (let i = 1; i <= 30; i++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day-box');
        dayBox.innerText = i;
        if (completedDays.includes(i)) dayBox.classList.add('completed');
        dayBox.onclick = () => openTask(i);
        mapContainer.appendChild(dayBox);
    }

    function openTask(day) {
        selectedDay = day;
        document.getElementById('modal-day-title').innerText = "Gün " + day;
        document.getElementById('modal-task-text').innerText = tasks[day-1];
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('task-modal').style.display = 'block';
        document.getElementById('task-modal').className = 'animate__animated animate__bounceIn';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('task-modal').style.display = 'none';
    }

    function completeTask() {
        if (!completedDays.includes(selectedDay)) {
            points += 10;
            completedDays.push(selectedDay);
            localStorage.setItem('marafonPoints', points);
            localStorage.setItem('completedDays', JSON.stringify(completedDays));
            updateStats();
            // Günün rəngini dəyiş
            const boxes = document.querySelectorAll('.day-box');
            boxes[selectedDay-1].classList.add('completed');
        }
        closeModal();
    }

    function closeWelcome() {
        const welcome = document.getElementById('welcome-overlay');
        welcome.classList.add('animate__animated', 'animate__fadeOut');
        setTimeout(() => welcome.style.display = 'none', 500);
    }

    updateStats();
</script>

</body>
</html>
