<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Marafonu | 30 Günlük Macəra</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --gold: #d4af37;
            --dark-blue: #0c1445;
            --light-blue: #1d2b64;
            --white: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, var(--dark-blue), var(--light-blue));
            color: var(--white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .stat-card span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
        }

        /* 30 Günlük Xəritə Görüntüsü */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 600px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .day-box {
            width: 70px;
            height: 70px;
            background: var(--dark-blue);
            border: 2px solid var(--gold);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
        }

        .day-box:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 15px var(--gold);
        }

        .day-box.completed {
            background: var(--gold);
            color: var(--dark-blue);
        }

        .day-box.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        /* Tapşırıq Modal (Pəncərə) */
        #task-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--white);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            z-index: 1000;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        .btn-complete {
            background: var(--dark-blue);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }
    </style>
</head>
<body>

<header class="animate__animated animate__fadeInDown">
    <h1>🌙 Ramazan Marafonu</h1>
    <p>Hər gün bir yaxşılıq, 30 günlük mənəvi macəra</p>
</header>

<div class="stats-container animate__animated animate__fadeInUp">
    <div class="stat-card">
        Xalın <span id="user-points">0</span>
    </div>
    <div class="stat-card">
        Gün <span id="current-day">1 / 30</span>
    </div>
</div>

<div class="grid-container animate__animated animate__zoomIn" id="map">
    </div>

<div class="overlay" id="overlay"></div>
<div id="task-modal" class="animate__animated animate__bounceIn">
    <h3 id="modal-day-title">Gün 1</h3>
    <p id="modal-task-text">Bu gün bir nəfərə salam ver və gülümsə.</p>
    <button class="btn-complete" onclick="completeTask()">Tamamladım (+10 Bal)</button>
    <button onclick="closeModal()" style="border:none; background:none; color:red; display:block; margin: 10px auto; cursor:pointer;">Bağla</button>
</div>

<script>
    // Tapşırıqlar siyahısı (Bunu Firebase-dən də çəkmək olar)
    const tasks = [
        "Bu gün bir nəfərə salam ver və gülümsə.",
        "Bu gün iftarda su yerinə xurma ilə aç və faydasını oxu.",
        "Yaxın bir dostuna hal-əhval mesajı yaz.",
        "Bu gün 10 səhifə kitab oxu.",
        "Ailən üçün kiçik bir sürpriz et (məsələn, süfrəni sən yığ).",
        // Digər 25 gün üçün bura tapşırıqlar əlavə edilə bilər...
    ];

    let points = localStorage.getItem('marafonPoints') || 0;
    let completedDays = JSON.parse(localStorage.getItem('completedDays')) || [];
    let selectedDay = null;

    document.getElementById('user-points').innerText = points;

    // Xəritəni yarat
    const mapContainer = document.getElementById('map');
    for (let i = 1; i <= 30; i++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day-box');
        dayBox.innerText = i;
        
        if (completedDays.includes(i)) {
            dayBox.classList.add('completed');
        }

        dayBox.onclick = () => openTask(i);
        mapContainer.appendChild(dayBox);
    }

    function openTask(day) {
        selectedDay = day;
        document.getElementById('modal-day-title').innerText = "Gün " + day;
        document.getElementById('modal-task-text').innerText = tasks[day-1] || "Bu gün üçün tapşırıq: Mərhəmətli ol!";
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('task-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('task-modal').style.display = 'none';
    }

    function completeTask() {
        if (!completedDays.includes(selectedDay)) {
            points = parseInt(points) + 10;
            completedDays.push(selectedDay);
            
            // Yaddaşa yaz
            localStorage.setItem('marafonPoints', points);
            localStorage.setItem('completedDays', JSON.stringify(completedDays));
            
            // Ekranı yenilə
            document.getElementById('user-points').innerText = points;
            location.reload(); // Sadəlik üçün səhifəni yeniləyirik
        } else {
            alert("Bu günü artıq tamamlamısan!");
        }
        closeModal();
    }
</script>

</body>
</html>
