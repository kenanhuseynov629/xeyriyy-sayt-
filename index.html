<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Yaxşılıq Sayğacı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .counter-box {
            font-size: 3rem;
            font-weight: bold;
            color: #27ae60;
            margin: 20px 0;
            padding: 10px;
            border-bottom: 2px solid #eee;
        }
        p { color: #7f8c8d; }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #219150;
            transform: scale(1.05);
        }
        .btn:active { transform: scale(0.95); }
        .history {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #95a5a6;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌙 Ramazan Paylaşımı</h1>
    <p>Bu gün dünyada edilən cəmi yaxşılıq sayı:</p>
    
    <div class="counter-box" id="count">0</div>
    
    <button class="btn" onclick="addGoodDeed()">✨ Bir yaxşılıq etdim!</button>
    
    <div class="history" id="message">Hər kiçik addım böyük bir fərq yaradır.</div>
</div>

<script>
    // Real layihədə bu rəqəm bazadan (Firebase və s.) gəlməlidir.
    // İndi isə brauzerin yaddaşından (localStorage) istifadə edirik.
    let count = localStorage.getItem('goodDeeds') || 0;
    document.getElementById('count').innerText = count;

    function addGoodDeed() {
        count++;
        document.getElementById('count').innerText = count;
        localStorage.setItem('goodDeeds', count);
        
        // Maraqlı mesajlar siyahısı
        const messages = [
            "Möhtəşəmsən! Allah qəbul etsin.",
            "Dünya səninlə daha gözəldir.",
            "Bir təbəssüm belə sədəqədir.",
            "Yaxşılıq yoluxucudur, davam et!",
            "Bu gün bir qəlbi sevindirdin."
        ];
        
        const randomMsg = messages[Math.floor(Math.random() * messages.length)];
        document.getElementById('message').innerText = randomMsg;
    }
</script>

</body>
</html>
